      - '.github/workflows/windows-russian-production-signing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Windows signing repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run Windows signing contract tests
        run: python -m pytest -q tests/test_windows_russian_production_signing.py tests/test_windows_powershell51_signing_chain.py tests/test_windows_signed_set_lifecycle_acceptance.py tests/test_windows_signed_set_lifecycle_owner_host.py tests/test_windows_signed_set_lifecycle_runtime.py tests/test_windows_signed_set_lifecycle_drift.py tests/test_windows_signed_set_lifecycle_legacy_host.py tests/test_windows_signed_set_lifecycle_guarded.py tests/test_windows_signed_set_lifecycle_migration.py tests/test_windows_app_control_compatibility.py tests/test_windows_app_control_local_gate.py tests/test_windows_app_control_final_local_gate.py tests/test_russian_signed_release_integration.py tests/test_russian_production_release_gate.py

  powershell-syntax:
    name: Windows signing PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Parse signing and App Control scripts as UTF-8
        shell: powershell
        run: |
          $files = @(
            'tools/windows_russian_production_signing.ps1',
            'tools/windows_signed_set_lifecycle_acceptance.ps1',
            'tools/windows_signed_set_lifecycle_acceptance_owner_host.ps1',
            'tools/windows_signed_set_lifecycle_acceptance_runtime.ps1',
            'tools/windows_signed_set_lifecycle_acceptance_drift.ps1',
            'tools/windows_signed_set_lifecycle_acceptance_legacy_host.ps1',
            'tools/windows_signed_set_lifecycle_acceptance_guarded.ps1',
            'tools/windows_signed_set_lifecycle_acceptance_migration.ps1',
            'tools/windows_app_control_assess.ps1',
            'tools/windows_app_control_enterprise_trust_pack.ps1',
            'tools/windows_app_control_local_gate.ps1',
            'tools/windows_app_control_upgrade_acceptance.ps1',
            'tools/windows_app_control_local_gate_complete.ps1',
            'tools/windows_owner_source_mode.ps1',
            'tools/russian_signed_release.ps1',
            'tools/prepare_russian_release_verification_ux.ps1',
            'tools/russian_production_release_gate.ps1',
            'tools/verify_russian_release.ps1',
            'tests/windows_app_control_configci_smoke.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $text = [System.IO.File]::ReadAllText(
              (Resolve-Path $file),
              [System.Text.Encoding]::UTF8
            )
            [System.Management.Automation.Language.Parser]::ParseInput(
              $text,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}: line {1}, col {2}: {3}" -f $file, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              throw "PowerShell parse failed: $file"
            }
          }
      - name: Run APL-WIN-014 ConfigCI supplemental-policy smoke
        shell: powershell
        run: .\tests\windows_app_control_configci_smoke.ps1
