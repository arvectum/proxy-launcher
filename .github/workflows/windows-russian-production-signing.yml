      - 'docs/WINDOWS_APP_CONTROL_COMPATIBILITY.md'
      - 'docs/APL_WIN_014_LOCAL_GATE.md'
      - 'docs/ROADMAP.md'
      - 'tests/test_windows_russian_production_signing.py'
      - 'tests/test_windows_powershell51_signing_chain.py'
