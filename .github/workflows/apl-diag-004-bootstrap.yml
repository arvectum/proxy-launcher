name: APL-DIAG-004 Bootstrap Apply

on:
  push:
    branches:
      - feature/apl-diag-004-doctor
    paths:
      - '.github/workflows/apl-diag-004-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apl-diag-004-doctor
          fetch-depth: 0
      - name: Apply verified existing-file patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/APL-DIAG-004-existing.patch
          git apply .github/APL-DIAG-004-existing.patch
          rm .github/APL-DIAG-004-existing.patch
          rm .github/workflows/apl-diag-004-bootstrap.yml
          python -m py_compile proxy_core.py proxy_gui.py secret_redaction.py windows_diagnostics.py doctor.py
          python -m unittest tests.test_doctor -v
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit final APL-DIAG-004 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'APL-DIAG-004 — Doctor automated self-diagnostics'
          git push origin HEAD:feature/apl-diag-004-doctor
