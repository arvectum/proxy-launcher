name: APL-DIAG-004 Bootstrap Apply
# retry: 5 — push verified non-workflow changes only

on:
  push:
    branches:
      - feature/apl-diag-004-doctor
    paths:
      - '.github/workflows/apl-diag-004-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apl-diag-004-doctor
          fetch-depth: 0
      - name: Install GUI test dependency
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -c "import tkinter"
      - name: Apply verified non-workflow changes and test
        shell: bash
        run: |
          set -euo pipefail
          git apply --check \
            --exclude=tests/test_windows_diagnostics.py \
            --exclude=.github/workflows/windows-p0.yml \
            .github/APL-DIAG-004-existing.patch
          git apply \
            --exclude=tests/test_windows_diagnostics.py \
            --exclude=.github/workflows/windows-p0.yml \
            .github/APL-DIAG-004-existing.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_windows_diagnostics.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match in {path}: {old!r}; found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '        self.events = []\n',
              '        self.events = []\n        self.load_settings_migrate_flags = []\n',
          )
          replace_once(
              '    def load_settings(self):\n        return {\n',
              '    def load_settings(self, migrate_legacy=True):\n'
              '        self.load_settings_migrate_flags.append(migrate_legacy)\n'
              '        return {\n',
          )
          replace_once(
              '            self.assertTrue(snapshot["sections"]["recovery"]["data"]["network_restore_pending"])\n',
              '            self.assertTrue(snapshot["sections"]["recovery"]["data"]["network_restore_pending"])\n'
              '            self.assertEqual(fake.load_settings_migrate_flags, [False, False, False])\n',
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm .github/APL-DIAG-004-existing.patch
          python -m py_compile proxy_core.py proxy_gui.py secret_redaction.py windows_diagnostics.py doctor.py
          python -m unittest tests.test_doctor -v
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit and push verified non-workflow state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/apl-diag-004-bootstrap.yml .github/workflows/windows-p0.yml
          git commit -m 'APL-DIAG-004 — Doctor automated self-diagnostics'
          git push origin HEAD:feature/apl-diag-004-doctor
