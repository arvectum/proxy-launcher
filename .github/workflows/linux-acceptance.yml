name: APL-LNX-009 Debian Ubuntu acceptance
on:
  pull_request:
    branches: [main]
    paths: ['linux_*.py','tools/build_linux_deb.sh','tools/*appimage*','tests/test_linux*.py','docs/APL_LNX_009_DEBIAN_UBUNTU_ACCEPTANCE.md','.github/workflows/linux-acceptance.yml','VERSION']
  push:
    branches: [main]
    paths: ['linux_*.py','tools/build_linux_deb.sh','tools/*appimage*','tests/test_linux*.py','docs/APL_LNX_009_DEBIAN_UBUNTU_ACCEPTANCE.md','.github/workflows/linux-acceptance.yml','VERSION']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk curl file
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-build.lock.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Linux contract/regression suite
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m unittest discover -s tests -p 'test_linux*.py' -v
      - name: Build release-form artifacts
        run: |
          ./build_linux.sh
          ./tools/build_linux_deb.sh
          ./tools/fetch_appimage_toolchain.sh
          ./tools/build_linux_appimage.sh
      - name: Debian install remove lifecycle on ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find dist/deb -name '*.deb' -print -quit)"
          marker="$HOME/.config/arvectum-proxy-launcher/apl-lnx-009-user-marker"
          mkdir -p "$(dirname "$marker")" && printf 'preserve\n' > "$marker"
          sudo dpkg --force-depends -i "$deb"
          test -x /usr/bin/arvectum-proxy-launcher
          test -x '/opt/arvectum-proxy-launcher/Arvectum Proxy Launcher'
          test "$(cat "$marker")" = preserve
          sudo dpkg -r arvectum-proxy-launcher
          test ! -e /usr/bin/arvectum-proxy-launcher
          test "$(cat "$marker")" = preserve
      - name: AppImage extraction acceptance
        shell: bash
        run: |
          set -euo pipefail
          image="$(find dist/appimage -name '*.AppImage' -print -quit)"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/arvectum-proxy-launcher
          grep -q '^Exec=arvectum-proxy-launcher$' squashfs-root/arvectum-proxy-launcher.desktop
      - name: Evidence
        shell: bash
        run: |
          printf 'APL-LNX-009 PASS\nos=%s\nversion=%s\ncommit=%s\n' '${{ matrix.os }}' "$(cat VERSION)" "$GITHUB_SHA" | tee "apl-lnx-009-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: apl-lnx-009-${{ matrix.os }}
          path: apl-lnx-009-${{ matrix.os }}.txt
