name: APL-IP-003 Slice 20 closure roadmap edit

on:
  push:
    branches:
      - apl-ip-003-slice-20-closure
    paths:
      - .github/workflows/apl-ip-003-slice20-closure-edit.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apl-ip-003-slice-20-closure
      - name: Advance canonical roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/APL_IP_003_CANONICAL_SOURCE_REFACTOR.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Status: **ACTIVE — SLICES 1–19 MERGED; FINAL CLEAN-IP APPROVAL STILL HUMAN/LEGAL GATED**',
              'Status: **ACTIVE — SLICES 1–20 MERGED; FINAL CLEAN-IP APPROVAL STILL HUMAN/LEGAL GATED**',
          )
          old = '- **NEXT — Slice 20:** maintained-source patch-history & canonical terminology normalization. Remove obsolete APL-IP-003 slice/task narration and now-false compatibility/"later extraction" language from maintained production docstrings/comments, replace it with durable architectural descriptions, and add a source-hygiene guard. Preserve behavioral legacy terminology that denotes real compatibility data, migration, recovery ownership or historical release formats.'
          new = '- **DONE — Slice 20:** maintained-source terminology normalization. PR `#156`, merge commit `249886a8914f78b769980458621fa33b7b86dc27`. Thirteen canonical production modules now describe current ownership and composition boundaries instead of APL-IP-003 slice history; real behavioral legacy terminology remains intact. `tests/test_source_hygiene.py` prevents obsolete migration narration from returning. Final implementation head completed all 18 triggered workflows successfully, including canonical-source Windows/macOS/Ubuntu, a 626-test Windows clean build plus Documents/Doctor smokes, installer E2E/Gate R6, controlled offline/no-index build, macOS, Debian/AppImage, diagnostics and security/provenance gates. Closure evidence is recorded in `docs/evidence/APL_IP_003_SLICE_20_MAINTAINED_SOURCE_TERMINOLOGY.md`.\n- **NEXT — Slice 21:** regression naming & repository hygiene. Remove obsolete `sliceN` task numbering from maintained test names, canonicalize stale current-repository references while preserving `.mailmap`, release baselines and historical evidence, and add permanent guards against both forms of maintenance debt.'
          if old not in text:
              raise SystemExit('Slice 20 NEXT marker not found')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit roadmap and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Arvectum Automation"
          git config user.email "automation@arvectum.com"
          git add docs/APL_IP_003_CANONICAL_SOURCE_REFACTOR.md
          git rm .github/workflows/apl-ip-003-slice20-closure-edit.yml
          git diff --cached --check
          git commit -m "APL-IP-003 Slice 20: advance canonical roadmap"
          git push origin HEAD:apl-ip-003-slice-20-closure
