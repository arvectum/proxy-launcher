name: APL-WIN-001 branch patch

on:
  push:
    branches:
      - feat/apl-win-001-final-status-ux

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Apply APL-WIN-001 patch
        run: |
          python tools/apply_apl_win_001.py
          python tools/apl_win_001_compat.py

      - name: Compile changed Python
        run: python -m py_compile proxy_gui.py tests/test_proxy_gui.py

      - name: Run GUI contract tests
        run: python -m unittest tests.test_proxy_gui

      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit verified implementation
        shell: bash
        run: |
          rm tools/apply_apl_win_001.py
          rm tools/apl_win_001_compat.py
          rm .github/workflows/apl-win-001-branch-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "APL-WIN-001: final status UX"
          git push origin HEAD:feat/apl-win-001-final-status-ux