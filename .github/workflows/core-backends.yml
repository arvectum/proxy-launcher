name: Core backend contract

on:
  pull_request:
    paths:
      - proxy_backend.py
      - backend_contract.py
      - backend_runtime.py
      - capability_model.py
      - proxy_core.py
      - system_proxy_runtime.py
      - windows_backend.py
      - macos_backend.py
      - linux_backend.py
      - linux_runtime.py
      - linux_networkmanager_preflight.py
      - linux_policykit_ux.py
      - linux_autostart.py
      - linux_gui.py
      - tests/test_proxy_backend.py
      - tests/test_backend_contract_matrix.py
      - tests/test_backend_runtime.py
      - tests/test_backend_runtime_wiring.py
      - tests/test_canonical_source_refactor.py
      - tests/test_canonical_core_composition.py
      - tests/test_capability_model.py
      - tests/test_windows_backend.py
      - tests/test_macos_backend.py
      - tests/test_linux_backend.py
      - tests/test_linux_runtime.py
      - tests/test_linux_networkmanager_preflight.py
      - tests/test_linux_runtime_preflight_wiring.py
      - tests/test_linux_policykit_ux.py
      - tests/test_linux_autostart.py
      - core/**
      - docs/APL_CORE_006_CAPABILITY_MODEL_UNSUPPORTED_FEATURE_UX.md
      - docs/APL_CORE_007_UNIFIED_BACKEND_CONTRACT_REGRESSION_MATRIX.md
      - docs/APL_LNX_001_LINUX_ASTRA_RUNTIME_ENVIRONMENT_DETECTION.md
      - docs/APL_LNX_002_LINUX_ASTRA_NETWORKMANAGER_PREFLIGHT.md
      - docs/APL_LNX_003_RUNTIME_PREFLIGHT_ENFORCEMENT_CAPABILITY_UX.md
      - docs/APL_LNX_004_LINUX_ASTRA_GUI_CAPABILITY_POLICYKIT_UX.md
      - docs/APL_LNX_005_PRODUCTION_SAFE_LINUX_AUTOSTART.md
      - .github/workflows/core-backends.yml
  push:
    branches:
      - main
    paths:
      - proxy_backend.py
      - backend_contract.py
      - backend_runtime.py
      - capability_model.py
      - proxy_core.py
      - system_proxy_runtime.py
      - windows_backend.py
      - macos_backend.py
      - linux_backend.py
      - linux_runtime.py
      - linux_networkmanager_preflight.py
      - linux_policykit_ux.py
      - linux_autostart.py
      - linux_gui.py
      - tests/test_proxy_backend.py
      - tests/test_backend_contract_matrix.py
      - tests/test_backend_runtime.py
      - tests/test_backend_runtime_wiring.py
      - tests/test_canonical_source_refactor.py
      - tests/test_canonical_core_composition.py
      - tests/test_capability_model.py
      - tests/test_windows_backend.py
      - tests/test_macos_backend.py
      - tests/test_linux_backend.py
      - tests/test_linux_runtime.py
      - tests/test_linux_networkmanager_preflight.py
      - tests/test_linux_runtime_preflight_wiring.py
      - tests/test_linux_policykit_ux.py
      - tests/test_linux_autostart.py
      - core/**
      - docs/APL_CORE_006_CAPABILITY_MODEL_UNSUPPORTED_FEATURE_UX.md
      - docs/APL_CORE_007_UNIFIED_BACKEND_CONTRACT_REGRESSION_MATRIX.md
      - docs/APL_LNX_001_LINUX_ASTRA_RUNTIME_ENVIRONMENT_DETECTION.md
      - docs/APL_LNX_002_LINUX_ASTRA_NETWORKMANAGER_PREFLIGHT.md
      - docs/APL_LNX_003_RUNTIME_PREFLIGHT_ENFORCEMENT_CAPABILITY_UX.md
      - docs/APL_LNX_004_LINUX_ASTRA_GUI_CAPABILITY_POLICYKIT_UX.md
      - docs/APL_LNX_005_PRODUCTION_SAFE_LINUX_AUTOSTART.md
      - .github/workflows/core-backends.yml

permissions:
  contents: read

jobs:
  backend-contract:
    name: Backend contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend modules
        run: >-
          python -m py_compile
          proxy_backend.py
          backend_contract.py
          backend_runtime.py
          capability_model.py
          proxy_core.py
          system_proxy_runtime.py
          windows_backend.py
          macos_backend.py
          linux_backend.py
          linux_runtime.py
          linux_networkmanager_preflight.py
          linux_policykit_ux.py
          linux_autostart.py
          linux_gui.py
          tests/test_proxy_backend.py
          tests/test_backend_contract_matrix.py
          tests/test_backend_runtime.py
          tests/test_backend_runtime_wiring.py
          tests/test_canonical_source_refactor.py
          tests/test_canonical_core_composition.py
          tests/test_capability_model.py
          tests/test_windows_backend.py
          tests/test_macos_backend.py
          tests/test_linux_backend.py
          tests/test_linux_runtime.py
          tests/test_linux_networkmanager_preflight.py
          tests/test_linux_runtime_preflight_wiring.py
          tests/test_linux_policykit_ux.py
          tests/test_linux_autostart.py

      - name: Run backend contract tests
        run: >-
          python -m unittest -v
          tests.test_proxy_backend
          tests.test_backend_contract_matrix
          tests.test_backend_runtime
          tests.test_backend_runtime_wiring
          tests.test_canonical_source_refactor
          tests.test_canonical_core_composition
          tests.test_capability_model
          tests.test_windows_backend
          tests.test_macos_backend
          tests.test_linux_backend
          tests.test_linux_runtime
          tests.test_linux_networkmanager_preflight
          tests.test_linux_runtime_preflight_wiring
          tests.test_linux_policykit_ux
          tests.test_linux_autostart

      - name: Verify Linux nmcli availability
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v nmcli >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y network-manager
          fi
          command -v nmcli
          nmcli --version

      - name: Verify macOS networksetup surface
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          help_output="$(/usr/sbin/networksetup -help 2>&1 || true)"
          for flag in \
            -listallnetworkservices \
            -getautoproxyurl \
            -setautoproxyurl \
            -setautoproxystate \
            -getproxybypassdomains \
            -setproxybypassdomains
          do
            grep -q -- "$flag" <<<"$help_output"
          done
