name: APL-IP-003 Slice 22 bounded normalization

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apl-ip-003-slice22-normalize.yml'
  push:
    branches: [apl-ip-003-slice-22-application-backend-hygiene]
    paths:
      - '.github/workflows/apl-ip-003-slice22-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apl-ip-003-slice-22-application-backend-hygiene
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Normalize maintained production narration and internal boundary names
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast

          root = Path('.')
          labels = {
              'APL-CORE-001': 'the platform backend contract',
              'APL-CORE-002': 'the Windows backend adapter',
              'APL-CORE-003': 'the macOS backend adapter',
              'APL-CORE-004': 'the Linux backend adapter',
              'APL-CORE-005': 'central backend selection',
              'APL-CORE-006': 'the capability model',
              'APL-CORE-007': 'the unified backend contract',
              'APL-LNX-001': 'Linux platform detection',
              'APL-LNX-002': 'the Linux NetworkManager preflight',
              'APL-LNX-003': 'the Linux operational gate',
              'APL-LNX-004': 'the interactive PolicyKit path',
              'APL-LNX-005': 'Linux autostart ownership',
              'APL-LNX-006': 'Linux diagnostics',
              'APL-MAC-001': 'the macOS networksetup preflight',
              'APL-MAC-002': 'the macOS capability UX',
              'APL-MAC-003': 'macOS diagnostics',
              'APL-MAC-006': 'macOS autostart ownership',
              'APL-WIN-001': 'Windows single-instance activation',
              'APL-WIN-002': 'Windows connection diagnostics',
              'APL-DIAG-001': 'structured logging',
              'APL-DIAG-002': 'diagnostic secret redaction',
              'APL-DIAG-003': 'platform diagnostics',
              'APL-DIAG-004': 'support-bundle diagnostics',
              'APL-REC-001': 'recovery-state ownership',
              'APL-REC-002': 'recovery mutation ownership',
              'APL-ROUTE-001': 'routing-rule ownership',
              'APL-ROUTE-003': 'the Windows application-routing gate',
              'APL-ROUTE-004': 'routing ownership persistence',
              'APL-IP-003': 'the canonical source architecture',
          }

          production = set(root.glob('*.py'))
          for directory in ('core', 'diagnostics'):
              base = root / directory
              if base.exists():
                  production.update(base.rglob('*.py'))

          changed = []
          for path in sorted(production):
              text = path.read_text(encoding='utf-8-sig')
              updated = text
              for old, new in labels.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  ast.parse(updated)
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())
          print('narrative files:', changed)

          identifier_replacements = {
              'legacy_core': 'runtime_core',
              '_resolved_legacy_config': '_resolved_runtime_config',
              '_config_matches_legacy_runtime': '_config_matches_runtime',
              'test_windows_requires_explicit_captured_legacy_core': 'test_windows_requires_explicit_captured_runtime_core',
          }
          identifier_files = []
          for path in sorted(root.rglob('*.py')):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8-sig')
              updated = text
              for old, new in identifier_replacements.items():
                  updated = updated.replace(old, new)
              updated = updated.replace('captured legacy core adapter', 'captured runtime core adapter')
              updated = updated.replace('captured legacy implementation', 'captured Windows implementation')
              updated = updated.replace('the legacy Windows runtime configuration', 'the current Windows runtime configuration')
              if path.name == 'windows_backend.py':
                  updated = updated.replace(
                      'the canonical source architecture Slice 8 moves WinINET, per-user proxy-environment\n'
                      'persistence and Windows system-proxy mutation into ``windows_system_proxy``;\n',
                      'WinINET, per-user proxy-environment persistence and Windows system-proxy mutation\n'
                      'are owned by ``windows_system_proxy``;\n',
                  )
                  updated = updated.replace(
                      '    Private method names containing ``legacy`` are retained as compatibility\n'
                      '    seams only; they no longer describe implementation ownership after Slice 8.\n',
                      '    Private helper names describe the current runtime adapter and configuration\n'
                      '    comparison boundary directly.\n',
                  )
              if updated != text:
                  ast.parse(updated)
                  path.write_text(updated, encoding='utf-8')
                  identifier_files.append(path.as_posix())
          print('identifier files:', identifier_files)

          for path in sorted(root.rglob('*.py')):
              if '.git' not in path.parts:
                  ast.parse(path.read_text(encoding='utf-8-sig'))
          PY
          python -m unittest tests.test_application_boundary_hygiene -v
          git diff --check
          git diff --stat
      - name: Commit bounded normalization and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Arvectum Automation"
          git config user.email "automation@arvectum.com"
          git add -u
          git add '*.py' core diagnostics tests 2>/dev/null || true
          git rm .github/workflows/apl-ip-003-slice22-normalize.yml
          git diff --cached --check
          git commit -m "APL-IP-003 Slice 22: normalize application backend boundary"
          git push origin HEAD:apl-ip-003-slice-22-application-backend-hygiene
