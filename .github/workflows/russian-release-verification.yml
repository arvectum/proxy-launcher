name: Russian Release Verification UX

on:
  push:
    branches:
      - main
    paths:
      - 'tools/verify_russian_release.ps1'
      - 'tools/VERIFY_RUSSIAN_RELEASE.cmd'
      - 'tools/prepare_russian_release_verification_ux.ps1'
      - 'release/APL_REL_012_RUSSIAN_RELEASE_VERIFICATION_END_USER_TRUST_UX.md'
      - 'tests/test_russian_release_verification.py'
      - '.github/workflows/russian-release-verification.yml'
  pull_request:
    paths:
      - 'tools/verify_russian_release.ps1'
      - 'tools/VERIFY_RUSSIAN_RELEASE.cmd'
      - 'tools/prepare_russian_release_verification_ux.ps1'
      - 'release/APL_REL_012_RUSSIAN_RELEASE_VERIFICATION_END_USER_TRUST_UX.md'
      - 'tests/test_russian_release_verification.py'
      - '.github/workflows/russian-release-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: REL-012 repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run REL-012 contract tests
        run: python -m pytest -q tests/test_russian_release_verification.py

  powershell-syntax:
    name: REL-012 Windows PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Parse consumer verification scripts as UTF-8
        shell: powershell
        run: |
          $files = @(
            'tools/verify_russian_release.ps1',
            'tools/prepare_russian_release_verification_ux.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $text = [System.IO.File]::ReadAllText(
              (Resolve-Path $file),
              [System.Text.Encoding]::UTF8
            )
            [System.Management.Automation.Language.Parser]::ParseInput(
              $text,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("line {0}, col {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              throw "PowerShell parse failed: $file"
            }
          }
