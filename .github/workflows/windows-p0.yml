name: Windows P0 portable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install --upgrade pip pyinstaller
      - name: Compile and test
        run: |
          python -m py_compile proxy_core.py proxy_gui.py
          python -m unittest discover -s tests -v
      - name: Build portable executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "Arvectum Proxy Launcher"
          --version-file "version_info.txt"
          --icon "assets\arvectum.ico"
          --add-data "no_proxy.txt;."
          --add-data "proxy_settings.json;."
          --add-data "assets;assets"
          proxy_gui.py
      - name: Package and verify artifact
        shell: pwsh
        run: |
          $out = 'artifact/Arvectum-Proxy-Launcher-Windows-P0'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item 'dist/Arvectum Proxy Launcher.exe' "$out/Arvectum Proxy Launcher.exe"
          Copy-Item 'release/README_PORTABLE_P0.txt' "$out/README.txt"
          $hash = (Get-FileHash "$out/Arvectum Proxy Launcher.exe" -Algorithm SHA256).Hash
          Set-Content "$out/SHA256.txt" "Arvectum Proxy Launcher.exe  SHA256  $hash" -Encoding ascii
          Compress-Archive -Path "$out/*" -DestinationPath 'artifact/Arvectum-Proxy-Launcher-Windows-P0.zip'
          Expand-Archive 'artifact/Arvectum-Proxy-Launcher-Windows-P0.zip' -DestinationPath 'artifact/verify'
          if ((Get-FileHash 'artifact/verify/Arvectum Proxy Launcher.exe' -Algorithm SHA256).Hash -ne $hash) { throw 'Artifact hash mismatch' }
          Get-Content "$out/SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Arvectum-Proxy-Launcher-Windows-P0
          path: artifact/Arvectum-Proxy-Launcher-Windows-P0.zip
