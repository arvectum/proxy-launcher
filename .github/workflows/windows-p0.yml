name: Windows P0 portable

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned build dependency
        run: python -m pip install --upgrade pip==25.3 pyinstaller==6.22.0

      - name: Read and validate canonical version
        id: version
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'VERSION')) {
              throw 'Canonical VERSION file is missing'
          }
          $raw = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($raw -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$') {
              throw "Invalid SemVer version in VERSION: '$raw'"
          }
          Write-Host "Canonical product version: $raw"
          "version=$raw" >> $env:GITHUB_OUTPUT

      - name: Compile and test
        run: |
          python -m py_compile proxy_core.py proxy_gui.py
          python -m unittest discover -s tests -v

      - name: Build portable executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "Arvectum Proxy Launcher"
          --version-file "version_info.txt"
          --icon "assets\arvectum.ico"
          --add-data "no_proxy.txt;."
          --add-data "assets;assets"
          proxy_gui.py

      - name: Windows Documents execution smoke
        shell: pwsh
        run: |
          $canonicalDir = Join-Path $env:USERPROFILE 'Documents\ArvectumProxyLauncher'
          New-Item -ItemType Directory -Path $canonicalDir -Force | Out-Null
          $canonicalExe = Join-Path $canonicalDir 'Arvectum Proxy Launcher.exe'
          Copy-Item -LiteralPath 'dist/Arvectum Proxy Launcher.exe' -Destination $canonicalExe -Force
          $builtHash = (Get-FileHash -LiteralPath 'dist/Arvectum Proxy Launcher.exe' -Algorithm SHA256).Hash
          $canonicalHash = (Get-FileHash -LiteralPath $canonicalExe -Algorithm SHA256).Hash
          if ($builtHash -ne $canonicalHash) { throw 'Canonical Documents copy hash mismatch' }
          $p = Start-Process -FilePath $canonicalExe -ArgumentList '--status' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Documents EXE smoke failed with exit code $($p.ExitCode)" }
          Write-Host "Documents execution smoke PASS; SHA256=$canonicalHash"

      - name: Package and verify artifact
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $artifactName = "Arvectum-Proxy-Launcher-$ver-windows-x64-portable"
          $zipName = "$artifactName.zip"
          $stageDir = "artifact/$artifactName"

          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item 'dist/Arvectum Proxy Launcher.exe' "$stageDir/Arvectum Proxy Launcher.exe"
          Copy-Item 'release/README_PORTABLE_P0.txt' "$stageDir/README.txt"
          Copy-Item 'qa/diagnose_app_control.ps1' "$stageDir/diagnose_app_control.ps1"
          Copy-Item 'qa/run_p01_native_qa_v2.ps1' "$stageDir/run_p01_native_qa_v2.ps1"

          $exeHash = (Get-FileHash "$stageDir/Arvectum Proxy Launcher.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$stageDir/SHA256SUMS.txt" "$exeHash  Arvectum Proxy Launcher.exe" -Encoding ascii

          Compress-Archive -Path "$stageDir/*" -DestinationPath "artifact/$zipName" -Force
          $zipHash = (Get-FileHash "artifact/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Portable ZIP created: artifact/$zipName (SHA256: $zipHash)"

          # Unpack and verify hash
          Expand-Archive "artifact/$zipName" -DestinationPath 'artifact/verify' -Force
          $verifiedHash = (Get-FileHash 'artifact/verify/Arvectum Proxy Launcher.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($verifiedHash -ne $exeHash) {
              throw "Artifact verification hash mismatch: $verifiedHash != $exeHash"
          }
          Get-Content "$stageDir/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Arvectum-Proxy-Launcher-${{ steps.version.outputs.version }}-windows-x64-portable
          path: artifact/Arvectum-Proxy-Launcher-${{ steps.version.outputs.version }}-windows-x64-portable.zip
