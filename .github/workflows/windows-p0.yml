name: Windows P0 portable

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Run canonical Windows clean build
        id: clean_build
        shell: pwsh
        run: |
          ./tools/clean_build_windows.ps1 -PythonExecutable python

      - name: Windows Documents execution smoke
        shell: pwsh
        run: |
          $canonicalDir = Join-Path $env:USERPROFILE 'Documents\ArvectumProxyLauncher'
          New-Item -ItemType Directory -Path $canonicalDir -Force | Out-Null
          $canonicalExe = Join-Path $canonicalDir 'Arvectum Proxy Launcher.exe'
          Copy-Item -LiteralPath 'dist/Arvectum Proxy Launcher.exe' -Destination $canonicalExe -Force
          $builtHash = (Get-FileHash -LiteralPath 'dist/Arvectum Proxy Launcher.exe' -Algorithm SHA256).Hash
          $canonicalHash = (Get-FileHash -LiteralPath $canonicalExe -Algorithm SHA256).Hash
          if ($builtHash -ne $canonicalHash) { throw 'Canonical Documents copy hash mismatch' }
          $p = Start-Process -FilePath $canonicalExe -ArgumentList '--status' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Documents EXE smoke failed with exit code $($p.ExitCode)" }
          Write-Host "Documents execution smoke PASS; SHA256=$canonicalHash"

          $doctorReport = Join-Path $env:RUNNER_TEMP 'apl-diag-004-packaged-doctor.json'
          if (Test-Path -LiteralPath $doctorReport) { Remove-Item -LiteralPath $doctorReport -Force }
          $doctor = Start-Process -FilePath $canonicalExe -ArgumentList @('--doctor-json', $doctorReport) -PassThru -Wait
          if ($doctor.ExitCode -notin @(0,1,2)) {
            throw "Packaged Doctor smoke failed with unexpected exit code $($doctor.ExitCode)"
          }
          if (-not (Test-Path -LiteralPath $doctorReport)) { throw 'Packaged Doctor JSON was not created' }
          $doctorJson = Get-Content -LiteralPath $doctorReport -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($doctorJson.schema -ne 'arvectum.proxy.doctor.v1') { throw 'Unexpected packaged Doctor schema' }
          if ([int]$doctorJson.exit_code -ne $doctor.ExitCode) { throw 'Packaged Doctor exit_code mismatch' }
          Remove-Item -LiteralPath $doctorReport -Force
          Write-Host "Packaged Doctor smoke PASS; status=$($doctorJson.overall); exit=$($doctor.ExitCode)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.clean_build.outputs.artifact_name }}
          path: ${{ steps.clean_build.outputs.zip_path }}
