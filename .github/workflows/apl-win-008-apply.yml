name: APL-WIN-008 apply and verify

on:
  push:
    branches:
      - feature/apl-win-008-single-instance

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apl-win-008-single-instance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Apply proxy_gui integration
        shell: python
        run: |
          from pathlib import Path

          path = Path('proxy_gui.py')
          text = path.read_text(encoding='utf-8')

          old = 'import os\nimport sys\nimport subprocess\nimport threading\nimport tkinter as tk\n'
          new = 'import atexit\nimport os\nimport sys\nimport subprocess\nimport threading\nimport tkinter as tk\n'
          if old not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(old, new, 1)

          old = 'import doctor as doctor_module\nimport connection_test as connection_test_module\n'
          new = 'import doctor as doctor_module\nimport connection_test as connection_test_module\nimport windows_single_instance as single_instance_module\n'
          if old not in text:
              raise SystemExit('module import anchor not found')
          text = text.replace(old, new, 1)

          anchor = 'def _run_headless(mode):\n'
          helpers = 'def _clear_temporary_topmost(root):\n    try:\n        root.attributes("-topmost", False)\n    except Exception:\n        pass\n\n\ndef _activate_main_window(root):\n    """Restore and foreground the canonical GUI after a duplicate launch."""\n    try:\n        root.deiconify()\n    except Exception:\n        pass\n    try:\n        root.lift()\n    except Exception:\n        pass\n    try:\n        root.focus_force()\n    except Exception:\n        pass\n    try:\n        root.attributes("-topmost", True)\n        root.after(120, lambda: _clear_temporary_topmost(root))\n    except Exception:\n        pass\n\n\ndef _poll_single_instance_activation(root, instance):\n    """Consume duplicate-launch activation requests on the Tk main thread."""\n    try:\n        requested = instance.poll_activation()\n    except Exception as exc:\n        requested = False\n        core._log("single-instance activation poll failed: %s" % exc)\n    if requested:\n        _activate_main_window(root)\n    try:\n        root.after(150, lambda: _poll_single_instance_activation(root, instance))\n    except Exception:\n        pass\n\n\n'
          if anchor not in text:
              raise SystemExit('_run_headless anchor not found')
          text = text.replace(anchor, helpers + anchor, 1)

          old = '    if len(sys.argv) > 1 and sys.argv[1] in ("--start", "--stop", "--status", "--rollback"):\n        sys.argv = [sys.argv[0], sys.argv[1]]\n        return core.main()\n    try:\n        import ctypes\n'
          new = '    if len(sys.argv) > 1 and sys.argv[1] in ("--start", "--stop", "--status", "--rollback"):\n        sys.argv = [sys.argv[0], sys.argv[1]]\n        return core.main()\n\n    # Only the interactive GUI is single-instance. Service/doctor commands above\n    # remain callable while the GUI is open. Acquire before Tk and before local\n    # or network repair side effects so a duplicate launch is inert.\n    instance = single_instance_module.WindowsSingleInstance()\n    try:\n        primary = instance.acquire()\n    except Exception as exc:\n        core._log("single-instance mutex acquisition failed: %s" % exc)\n        return 1\n    if not primary:\n        try:\n            instance.notify_existing(APP_NAME)\n        finally:\n            instance.close()\n        return 0\n    atexit.register(instance.close)\n\n    try:\n        import ctypes\n'
          if old not in text:
              raise SystemExit('CLI integration anchor not found')
          text = text.replace(old, new, 1)

          old = '    app = Launcher(root)\n    root.mainloop()\n    return 0\n'
          new = '    app = Launcher(root)\n    _poll_single_instance_activation(root, instance)\n    root.mainloop()\n    instance.close()\n    return 0\n'
          if old not in text:
              raise SystemExit('mainloop anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Compile changed Python modules
        shell: pwsh
        run: python -m py_compile proxy_gui.py windows_single_instance.py tests/test_single_instance.py

      - name: Run focused regression tests
        shell: pwsh
        run: python -m unittest tests.test_proxy_gui tests.test_autostart_safety tests.test_single_instance -v

      - name: Run full regression suite
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Commit verified integration and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/apl-win-008-apply.yml' -Force
          git config user.name 'arvectum-ci'
          git config user.email 'ci@arvectum.com'
          git add proxy_gui.py .github/workflows/apl-win-008-apply.yml
          git commit -m 'APL-WIN-008: integrate single-instance GUI boundary [apl-win-008-applied]'
          git push origin HEAD:feature/apl-win-008-single-instance
