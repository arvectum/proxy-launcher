name: APL-IP-003 Slice 20 source normalization

on:
  push:
    branches:
      - apl-ip-003-slice-20-source-terminology
    paths:
      - .github/workflows/apl-ip-003-slice20-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apl-ip-003-slice-20-source-terminology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Normalize maintained production docstrings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import pathlib
          import re

          docs = {
              "proxy_core.py": """Canonical runtime composition root for Arvectum Proxy Launcher.

          Owns release/state bootstrap and installs explicit runtime owners onto the canonical ``proxy_core`` module. Ordinary dependencies remain with their owners, while behavior-sensitive collaborators resolve through this composition object.""",
              "application_filesystem.py": """Canonical application filesystem for Arvectum Proxy Launcher.

          Owns executable, persistent-state and runtime paths, including migration from known historical state locations. Runtime collaborators resolve through the canonical composition module; standard-library dependencies remain local.""",
              "portable_lifecycle.py": """Canonical portable-executable lifecycle for Arvectum Proxy Launcher.

          Owns the Windows portable stable-copy lifecycle: hash-verified replacement, install-owner marking, safe handoff and canonical-install recognition. Runtime collaborators resolve through the canonical composition module.""",
              "configuration_storage.py": """Canonical configuration storage for Arvectum Proxy Launcher.

          Owns the settings schema, validation, Windows credential protection, atomic persistence, last-known-good snapshots, quarantine and deterministic corruption recovery. Runtime collaborators resolve through the canonical composition module.""",
              "routing_policy.py": """Canonical no-proxy routing policy for Arvectum Proxy Launcher.

          Owns platform-neutral exclusion policy for PAC clients and the local HTTP/SOCKS engine: persistence, input normalization, host matching and PAC generation. Platform-specific system-proxy mutation remains outside this module.""",
              "local_proxy_transport.py": """Canonical local proxy transport for Arvectum Proxy Launcher.

          Owns the platform-neutral local enforcement plane: upstream preparation and failover, HTTP/CONNECT proxying, SOCKS5 tunnelling, PAC serving, relay loops and listener lifecycle. Process supervision, application orchestration and system-proxy mutation remain separate owners.""",
              "process_supervision.py": """Canonical process supervision for Arvectum Proxy Launcher.

          Owns PAC health probing, listener diagnostics, process identity checks, PID persistence, running-state evaluation and ownership-safe termination. Application orchestration and network recovery remain separate owners.""",
              "application_runtime.py": """Canonical application runtime orchestration for Arvectum Proxy Launcher.

          Owns top-level state bootstrap and CLI lifecycle orchestration. Filesystem, transport, process supervision, system-proxy mutation and recovery remain explicit owners and are resolved through the canonical composition module.""",
              "windows_system_proxy.py": """Canonical Windows system-proxy persistence for Arvectum Proxy Launcher.

          Owns WinINET and per-user proxy-environment persistence and mutation. Original user state is captured before mutation, ambiguous rollback evidence is never overwritten, and backup evidence is removed only after successful restore. Recovery Run and orphan-PAC recovery remain explicit separate owners.""",
              "recovery_autostart.py": """Canonical Windows Recovery Run ownership for Arvectum Proxy Launcher.

          Owns strict recovery/autostart command classification and HKCU Run-entry mutation. Ownership is proven by exact command/path structure, foreign same-named values are preserved, and process-inspection failures are fail-closed.""",
              "windows_pac_recovery.py": """Canonical stale/orphan Windows PAC recovery for Arvectum Proxy Launcher.

          Owns the narrowly bounded diagnostic and cleanup path for an Arvectum localhost PAC left configured after its runtime and rollback evidence are gone. Destructive cleanup requires exact ownership, absence of conflicting evidence, a durable snapshot and immediate pre-mutation revalidation.""",
              "logging_bridge.py": """Canonical proxy-core structured logging bridge for Arvectum Proxy Launcher.

          Owns construction of the proxy-core ``StructuredLogger`` singleton and the public ``structured_log`` and ``_log`` surfaces. JSONL persistence, redaction and rotation remain owned by ``structured_logging.py``; logger resolution stays dynamic for supported runtime patchability.""",
              "system_proxy_runtime.py": """Canonical system-proxy runtime composition for Arvectum Proxy Launcher.

          Owns platform backend selection, capability gates and fail-closed public system-proxy operations. The Windows adapter captures the canonical WinINET implementation, while recovery/autostart and orphan-PAC handling remain explicit separate owners.""",
          }

          configure_docs = {
              name: "Bind the canonical composition module used for runtime collaborators."
              for name in docs
              if name != "proxy_core.py"
          }
          configure_docs["system_proxy_runtime.py"] = (
              "Bind the canonical composition module and runtime-platform resolver."
          )

          def replacement(indent: str, text: str) -> str:
              parts = text.strip().splitlines()
              if len(parts) == 1:
                  return f'{indent}"""{parts[0]}"""\n'
              out = [f'{indent}"""{parts[0]}\n']
              out.extend(f"{indent}{line}\n" if line else "\n" for line in parts[1:])
              out.append(f'{indent}"""\n')
              return "".join(out)

          for filename, module_doc in docs.items():
              path = pathlib.Path(filename)
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              edits = []

              first = tree.body[0]
              if not (
                  isinstance(first, ast.Expr)
                  and isinstance(first.value, ast.Constant)
                  and isinstance(first.value.value, str)
              ):
                  raise SystemExit(f"{filename}: module docstring missing")
              edits.append((first.lineno - 1, first.end_lineno, replacement("", module_doc)))

              if filename in configure_docs:
                  configure = next(
                      (node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "configure"),
                      None,
                  )
                  if configure is None or not configure.body:
                      raise SystemExit(f"{filename}: configure() missing")
                  doc_node = configure.body[0]
                  if not (
                      isinstance(doc_node, ast.Expr)
                      and isinstance(doc_node.value, ast.Constant)
                      and isinstance(doc_node.value.value, str)
                  ):
                      raise SystemExit(f"{filename}: configure docstring missing")
                  lines = source.splitlines(keepends=True)
                  indent = re.match(r"\s*", lines[doc_node.lineno - 1]).group(0)
                  edits.append(
                      (
                          doc_node.lineno - 1,
                          doc_node.end_lineno,
                          replacement(indent, configure_docs[filename]),
                      )
                  )

              lines = source.splitlines(keepends=True)
              for start, end, text in sorted(edits, reverse=True):
                  lines[start:end] = [text]
              updated = "".join(lines)
              ast.parse(updated)
              path.write_text(updated, encoding="utf-8")

          forbidden = (
              "APL-IP-003",
              "proxy_core_legacy",
              "outside this slice",
              "later bounded",
              "extracted independently later",
          )
          for filename in docs:
              text = pathlib.Path(filename).read_text(encoding="utf-8")
              for token in forbidden:
                  if token.lower() in text.lower():
                      raise SystemExit(f"{filename}: obsolete migration language remains: {token}")
          PY

          python -m py_compile \
            proxy_core.py \
            application_filesystem.py portable_lifecycle.py configuration_storage.py \
            routing_policy.py local_proxy_transport.py process_supervision.py \
            application_runtime.py windows_system_proxy.py recovery_autostart.py \
            windows_pac_recovery.py logging_bridge.py system_proxy_runtime.py
          git diff --check
          git diff --stat

      - name: Commit normalized source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Arvectum Automation"
          git config user.email "automation@arvectum.com"
          git add \
            proxy_core.py \
            application_filesystem.py portable_lifecycle.py configuration_storage.py \
            routing_policy.py local_proxy_transport.py process_supervision.py \
            application_runtime.py windows_system_proxy.py recovery_autostart.py \
            windows_pac_recovery.py logging_bridge.py system_proxy_runtime.py
          git rm .github/workflows/apl-ip-003-slice20-normalize.yml
          git diff --cached --check
          git commit -m "APL-IP-003 Slice 20: normalize maintained source terminology"
          git push origin HEAD:apl-ip-003-slice-20-source-terminology
