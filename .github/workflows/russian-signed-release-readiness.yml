name: Russian Signed Release Readiness

on:
  push:
    branches:
      - main
    paths:
      - 'tools/russian_signed_release.ps1'
      - 'release/APL_REL_011_RUSSIAN_SIGNED_RELEASE_INTEGRATION_OTUC_READINESS.md'
      - 'tests/test_russian_signed_release_integration.py'
      - '.github/workflows/russian-signed-release-readiness.yml'
  pull_request:
    paths:
      - 'tools/russian_signed_release.ps1'
      - 'release/APL_REL_011_RUSSIAN_SIGNED_RELEASE_INTEGRATION_OTUC_READINESS.md'
      - 'tests/test_russian_signed_release_integration.py'
      - '.github/workflows/russian-signed-release-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: REL-011 repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.11'
      - name: Run REL-011 contract tests
        run: python -m pytest -q tests/test_russian_signed_release_integration.py
      - name: Prove signing remains owner-operated
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "secrets\." tools/russian_signed_release.ps1 .github/workflows/russian-signed-release-readiness.yml
          ! grep -R -Ei "rutoken|csptest|certificate" .github/workflows/russian-signed-release-readiness.yml
          grep -F '$embeddedCodeSigningActivated = $false' tools/russian_signed_release.ps1
          grep -F "RELEASE-EVIDENCE-ONLY" tools/russian_signed_release.ps1
