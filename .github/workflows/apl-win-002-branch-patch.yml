name: APL-WIN-002 branch patch

on:
  push:
    branches:
      - feat/apl-win-002-connection-test

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Apply APL-WIN-002 GUI patch
        run: python tools/apply_apl_win_002.py

      - name: Compile changed Python
        run: python -m py_compile connection_test.py proxy_gui.py tests/test_connection_test.py tests/test_proxy_gui.py

      - name: Run connection-test contracts
        run: python -m unittest tests.test_connection_test tests.test_proxy_gui

      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit verified implementation
        shell: bash
        run: |
          rm tools/apply_apl_win_002.py
          rm .github/workflows/apl-win-002-branch-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "APL-WIN-002: built-in connection test"
          git push origin HEAD:feat/apl-win-002-connection-test
