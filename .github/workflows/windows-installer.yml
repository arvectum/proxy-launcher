name: Windows installer
on:
  push:
    branches: [main, 'release/**', 'fix/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
  workflow_call:
jobs:
  installer:
    runs-on: windows-latest
    outputs:
      artifact_name: ${{ steps.installer.outputs.setup_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12.10' }
      - name: Install pinned Inno Setup 6.7.1
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Build portable baseline
        shell: pwsh
        run: ./tools/clean_build_windows.ps1 -PythonExecutable python
      - name: Compile installer
        id: installer
        shell: pwsh
        run: ./tools/build_windows_installer.ps1 -PythonExecutable python
      - name: Fresh install, status, upgrade, and uninstall smoke
        shell: pwsh
        run: |
          function Dump-InstallerDiagnostics {
            if (Test-Path installer-fresh.log) { Get-Content installer-fresh.log }
            if (Test-Path installer-upgrade.log) { Get-Content installer-upgrade.log }
            if (Test-Path installer-uninstall.log) { Get-Content installer-uninstall.log }
            $appLog = Join-Path $env:LOCALAPPDATA 'Arvectum\ProxyLauncher\install.log'
            if (Test-Path $appLog) { Get-Content $appLog }
          }
          $setup = '${{ steps.installer.outputs.setup_path }}'
          $freshLog = Join-Path $PWD 'installer-fresh.log'
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=$freshLog") -PassThru -Wait
          if ($p.ExitCode -ne 0) { Dump-InstallerDiagnostics; throw "fresh installer failed with exit code $($p.ExitCode)" }
          $exe = Join-Path $env:USERPROFILE 'Documents\ArvectumProxyLauncher\Arvectum Proxy Launcher.exe'
          if (-not (Test-Path -LiteralPath $exe)) { [Environment]::GetFolderPath('MyDocuments'); Get-ChildItem $env:USERPROFILE -Filter 'Arvectum Proxy Launcher.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object FullName; Dump-InstallerDiagnostics; throw 'fresh install did not create installed EXE' }
          $p = Start-Process -FilePath $exe -ArgumentList '--status' -PassThru -Wait
          if ($p.ExitCode -ne 0) { Dump-InstallerDiagnostics; throw "fresh install status failed with exit code $($p.ExitCode)" }
          $upgradeLog = Join-Path $PWD 'installer-upgrade.log'
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=$upgradeLog") -PassThru -Wait
          if ($p.ExitCode -ne 0) { Dump-InstallerDiagnostics; throw "upgrade installer failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path -LiteralPath $exe)) { Dump-InstallerDiagnostics; throw 'upgrade removed installed EXE' }
          $p = Start-Process -FilePath $exe -ArgumentList '--status' -PassThru -Wait
          if ($p.ExitCode -ne 0) { Dump-InstallerDiagnostics; throw "upgrade status failed with exit code $($p.ExitCode)" }
          $uninstaller = Join-Path (Split-Path $exe) 'unins000.exe'
          $uninstallLog = Join-Path $PWD 'installer-uninstall.log'
          $p = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$uninstallLog") -PassThru -Wait
          if ($p.ExitCode -ne 0) { Dump-InstallerDiagnostics; throw "uninstaller failed with exit code $($p.ExitCode)" }
          if (Test-Path -LiteralPath $exe) { Dump-InstallerDiagnostics; throw 'uninstall did not remove installed EXE' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.setup_name }}
          path: ${{ steps.installer.outputs.setup_path }}
