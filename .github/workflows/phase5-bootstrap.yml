          cat > CONFIGURATION_MODEL.md <<'EOF'
          # APL-SEC-001 — Configuration model

          Status: **IMPLEMENTED**

          The runtime configuration now has an explicit governed schema (`arvectum.proxy.settings.v1`) and `config_version = 1`.

          Security/validation rules:

          - only known top-level and upstream keys are accepted;
          - local HTTP, SOCKS5 and PAC ports must be integers in `1..65535` and must be distinct;
          - PAC path is a bounded absolute local path with query/fragment, whitespace and control characters rejected;
          - upstream entries are bounded to 16, hosts are host/address values rather than URLs, and port types/ranges are validated;
          - future unsupported schema versions fail closed;
          - missing legacy version metadata is accepted as version 0 and normalized to the current runtime model.

          Malformed or structurally invalid configuration is never trusted as runtime state.
          EOF

          cat > STABLE_DATA_DIRECTORIES.md <<'EOF'
          # APL-SEC-002 — Stable data directories

          Status: **IMPLEMENTED**

          Windows mutable state remains anchored under the per-user LocalAppData namespace:

          `%LOCALAPPDATA%\Arvectum\ProxyLauncher`

          The executable/install directory is not used for mutable Windows state. Configuration, last-known-good configuration, recovery evidence, quarantine, no-proxy state, PID/logs and recovery backups all resolve from the stable data root.

          New governed paths:

          - `proxy_settings.json` — active configuration;
          - `proxy_settings.lastgood.json` — previous validated configuration;
          - `config_recovery.json` — non-secret recovery evidence;
          - `quarantine/` — structurally corrupted configuration evidence.

          Tests assert that all Config & Security state is contained by the stable data directory.
          EOF

          cat > SECRETS_BOUNDARY.md <<'EOF'
          # APL-SEC-003 — Secrets boundary

          Status: **IMPLEMENTED**

          On Windows, upstream username/password material is serialized only inside a current-user DPAPI `credentials_dpapi` blob. The governed schema rejects mixing that blob with plaintext/legacy credential fields.

          Legacy plaintext settings are migrated on normal application load. During that migration the last-known-good snapshot is deliberately skipped, preventing creation of a second plaintext credential copy.

          Additional boundaries:

          - DPAPI protection failure aborts the save; there is no plaintext fallback on Windows;
          - diagnostics use read-only settings loading and the existing central secret-redaction layer;
          - corruption/recovery metadata stores filenames, hashes/reasons and recovery source only, never configuration contents or credentials;
          - diagnostics expose only path/state metadata for Config & Security recovery files.
          EOF

          cat > ATOMIC_CONFIGURATION_WRITES.md <<'EOF'
          # APL-SEC-004 — Atomic configuration writes

          Status: **IMPLEMENTED**

          Settings and `no_proxy.txt` now use a same-directory atomic writer:

          1. create a unique temporary file in the target directory;
          2. write the complete payload;
          3. flush Python buffers;
          4. `fsync` the file;
          5. atomically replace the target with `os.replace`;
          6. `fsync` the parent directory where supported;
          7. remove any leftover temporary file on failure.

          Before replacing a valid active settings file, its validated serialized form is atomically stored as `proxy_settings.lastgood.json` (except plaintext legacy Windows credentials, which are never duplicated).

          Injected replace failures preserve the previous primary configuration.
          EOF

          cat > CORRUPTED_CONFIGURATION_RECOVERY.md <<'EOF'
          # APL-SEC-005 — Corrupted configuration recovery

          Status: **IMPLEMENTED**

          Normal application loads distinguish structural corruption from ordinary I/O failures.

          For malformed JSON, invalid schema/types/ranges, unknown keys, or unsupported future configuration versions:

          - the corrupted primary is moved into the stable `quarantine/` directory;
          - a SHA-256 fingerprint and non-secret metadata sidecar are written when possible;
          - a validated last-known-good configuration is restored atomically when available;
          - otherwise the application runs with programmatic safe defaults without silently accepting malformed state;
          - `config_recovery.json` records the recovery source without embedding configuration content.

          A locked/unreadable file is **not** classified as corrupted and is never renamed or overwritten merely because an I/O operation failed.

          Diagnostic/read-only loads (`migrate_legacy=False`) do not quarantine or rewrite corrupted configuration.
          EOF

          cat > .github/workflows/config-security.yml <<'EOF'
          name: Phase 5 Config and Security

          on:
            push:
              branches: [main]
              paths:
                - 'proxy_core.py'
                - 'windows_diagnostics.py'
                - 'tests/test_config_security.py'
                - 'CONFIGURATION_MODEL.md'
                - 'STABLE_DATA_DIRECTORIES.md'
                - 'SECRETS_BOUNDARY.md'
                - 'ATOMIC_CONFIGURATION_WRITES.md'
                - 'CORRUPTED_CONFIGURATION_RECOVERY.md'
                - '.github/workflows/config-security.yml'
            pull_request:
              branches: [main]
              paths:
                - 'proxy_core.py'
                - 'windows_diagnostics.py'
                - 'tests/test_config_security.py'
                - 'CONFIGURATION_MODEL.md'
                - 'STABLE_DATA_DIRECTORIES.md'
                - 'SECRETS_BOUNDARY.md'
                - 'ATOMIC_CONFIGURATION_WRITES.md'
                - 'CORRUPTED_CONFIGURATION_RECOVERY.md'
                - '.github/workflows/config-security.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            contract:
              name: Config security contract (${{ matrix.os }})
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-latest, windows-latest]
              runs-on: ${{ matrix.os }}
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12.10'
                - name: Compile governed modules
                  run: python -m py_compile proxy_core.py windows_diagnostics.py
                - name: Run Phase 5 contract tests
                  run: python -m unittest tests.test_config_security -v
                - name: Run full unit suite
                  run: python -m unittest discover -s tests -v
          EOF

          rm -f .github/workflows/phase5-bootstrap.yml

      - name: Run Phase 5 tests before commit
        run: |
          python -m py_compile proxy_core.py windows_diagnostics.py
          python -m unittest tests.test_config_security -v
          python -m unittest discover -s tests -v

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "arvectum"
          git config user.email "arvectum@gmail.com"
          git add -A
          git commit -m "APL-SEC: complete Phase 5 implementation"
          git push origin HEAD:phase5/config-security
