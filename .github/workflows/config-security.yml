name: Phase 5 Config and Security

on:
  push:
    branches: [main]
    paths:
      - 'proxy_core.py'
      - 'windows_diagnostics.py'
      - 'tests/test_config_security.py'
      - 'CONFIGURATION_MODEL.md'
      - 'STABLE_DATA_DIRECTORIES.md'
      - 'SECRETS_BOUNDARY.md'
      - 'ATOMIC_CONFIGURATION_WRITES.md'
      - 'CORRUPTED_CONFIGURATION_RECOVERY.md'
      - '.github/workflows/config-security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'proxy_core.py'
      - 'windows_diagnostics.py'
      - 'tests/test_config_security.py'
      - 'CONFIGURATION_MODEL.md'
      - 'STABLE_DATA_DIRECTORIES.md'
      - 'SECRETS_BOUNDARY.md'
      - 'ATOMIC_CONFIGURATION_WRITES.md'
      - 'CORRUPTED_CONFIGURATION_RECOVERY.md'
      - '.github/workflows/config-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Config security contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Compile governed modules
        run: python -m py_compile proxy_core.py windows_diagnostics.py
      - name: Run Phase 5 contract tests
        run: python -m unittest tests.test_config_security -v
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
