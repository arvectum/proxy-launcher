name: APL-WIN-007 SAST fix

on:
  push:
    branches:
      - feature/apl-win-007-production-safe-autostart

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Apply SAST annotation
        run: python tools/apply_apl_win_007_sast_fix.py

      - name: Verify Bandit gate
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir bandit==1.9.4
          bandit -ll -ii proxy_core.py proxy_gui.py

      - name: Run full regression suite
        run: python -m unittest discover -s tests -v

      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy_gui.py
          git rm tools/apply_apl_win_007_sast_fix.py .github/workflows/apl-win-007-sast-fix.yml
          git commit -m "fix: satisfy APL-WIN-007 SAST gate"
          git push origin HEAD:feature/apl-win-007-production-safe-autostart
